commands:
  test-focused:
    executable: node
    args:
      - ../../../../../node_modules/tsx/dist/cli.mjs
      - --test
    acceptsTargets: true
    category: test
  test-command-service:
    executable: node
    args:
      - ../../../../../node_modules/tsx/dist/cli.mjs
      - --test
      - tests/server/projectCommandService.test.ts
      - tests/server/projectCommandVerificationCandidate.test.ts
    category: test
  test-zrok-bootstrap:
    executable: powershell.exe
    args:
      - -NoProfile
      - -ExecutionPolicy
      - Bypass
      - -File
      - scripts/verify-zrok-bootstrap.ps1
    category: test
