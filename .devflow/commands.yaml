commands:
  test-focused:
    executable: node
    args:
      - ../../../../../node_modules/tsx/dist/cli.mjs
      - --test
    acceptsTargets: true
    category: test
    reusePolicy: effective-input
  test-command-service:
    executable: node
    args:
      - ../../../../../node_modules/tsx/dist/cli.mjs
      - --test
      - tests/server/projectCommandService.test.ts
      - tests/server/projectCommandVerificationCandidate.test.ts
    category: test
    reusePolicy: exact-revision
  test-start-all:
    executable: node
    args:
      - ../../../../../node_modules/tsx/dist/cli.mjs
      - scripts/verify-start-all.ts
    category: test
    reusePolicy: disabled
